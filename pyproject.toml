[project]
name = "churro"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "verifiers>=0.3.0",
]

[project.scripts]
churro = "churro:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_spec.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
